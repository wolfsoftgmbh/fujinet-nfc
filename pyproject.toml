[project]
name = "fujinet-nfc"
version = "0.3.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
# Fremdcode: unveränderte ESPHome-Kopie, nicht nach Hausstil umformatieren.
extend-exclude = ["firmware/components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_defs = false      # Ausgangsstellung der Ratsche
check_untyped_defs = true   # sonst prueft mypy Ruempfe unannotierter Funktionen gar nicht
warn_unused_ignores = true

# Ratsche: Modul fuer Modul scharf stellen, sobald es sauber ist.
# [[tool.mypy.overrides]]
# module = "app.modules.scan.*"
# disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
