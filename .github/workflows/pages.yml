# Publishes the flash page (site/) on GitHub Pages: https://wolfsoftgmbh.github.io/fujinet-nfc/
# The workflow builds no firmware. site/firmware/*.bin is committed together with the page
# (made by `make seite` after `make release`); the job fails if the images are missing.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the firmware images are present
        run: |
          for l in en de; do
            test -s "site/firmware/fujinet-nfc-$l.factory.bin" || { echo "site/firmware/fujinet-nfc-$l.factory.bin is missing"; exit 1; }
          done
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
