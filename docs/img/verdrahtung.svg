<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1030" width="960" height="1030" role="img" aria-labelledby="t d" lang="de">
<title id="t">Verdrahtung: D1 mini, PN532, WS2812-LED, Summer</title><desc id="d">Ansicht von der Lötseite (USB-Chip, ohne ESP-Modul). PN532-I2C-Leiste am rechten Rand (SCL, SDA, VCC, GND von oben): SDA an D2, SCL an D1, VCC an 5V, GND an G; DIP-Schalter 1 ON, 2 OFF (I2C). WS2812-Platine, Eingangsseite: +5V an 5V, Din an D8, GND an G. Summer Plus an D7, Minus an G. Der D1 mini hat nur einen 5V- und einen G-Pin: Alle 5V-Leitungen und alle G-Leitungen treffen sich dort.</desc>
